name: 手动搬运数据库 (One-Time)

permissions:
  contents: write  # 允许发布 Release

on:
  workflow_dispatch: # 只允许手动点击按钮运行

jobs:
  one_time_copy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 1. 直接下载并改名
        run: |
          echo "开始下载..."
          # 直接写死你截图里的那个文件地址，不搞自动探测了，绝对稳
          wget -O ktv.db "https://github.com/chitue/dongliTV/releases/download/databases-20260130/song_9c8ec.db"
          
          # 检查一下文件多大，确认下载成功
          ls -lh ktv.db

      - name: 2. 发布到我的 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: database-static # 给个固定的版本号
          name: KTV 数据库 (静态版)
          body: |
            手动搬运自: databases-20260130
            文件名已重命名为: ktv.db
          files: ktv.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
